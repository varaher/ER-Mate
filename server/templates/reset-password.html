<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — ErMate</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      justify-content: center;
    }
    .logo-icon {
      width: 44px; height: 44px;
      background: #10b981;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: #fff; font-weight: 700;
    }
    .logo-name { font-size: 22px; font-weight: 700; color: #f1f5f9; }
    h1 { font-size: 20px; font-weight: 700; color: #f1f5f9; margin-bottom: 8px; text-align: center; }
    .subtitle { font-size: 14px; color: #94a3b8; text-align: center; margin-bottom: 28px; line-height: 1.5; }
    label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
    .input-wrap { position: relative; margin-bottom: 16px; }
    input[type="password"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #f1f5f9;
      font-size: 15px;
      padding: 12px 44px 12px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus { border-color: #10b981; }
    .eye-btn {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: #64748b; padding: 4px;
      display: flex; align-items: center;
    }
    .eye-btn:hover { color: #94a3b8; }
    .btn {
      width: 100%;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      padding: 14px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg {
      margin-top: 18px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }
    .msg.error { background: #3b0f0f; border: 1px solid #7f1d1d; color: #fca5a5; }
    .msg.success { background: #052e16; border: 1px solid #14532d; color: #86efac; }
    .hint { font-size: 12px; color: #64748b; margin-top: 4px; }
    #expired-state { display: none; text-align: center; }
    #expired-state p { color: #f87171; font-size: 15px; margin-bottom: 16px; }
    .back-link {
      display: block; text-align: center; margin-top: 20px;
      color: #10b981; font-size: 14px; text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">E</div>
      <div class="logo-name">ErMate</div>
    </div>

    <div id="loading-state" style="text-align:center;padding:20px 0;color:#64748b">Verifying link...</div>

    <div id="form-state" style="display:none">
      <h1>Set new password</h1>
      <p class="subtitle">Enter a new password for your account.</p>

      <label for="pw">New Password</label>
      <div class="input-wrap">
        <input type="password" id="pw" placeholder="At least 6 characters" autocomplete="new-password" />
        <button class="eye-btn" type="button" onclick="togglePw('pw','eyePw')" id="eyePw">
          <svg id="eyePwIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <label for="pw2">Confirm Password</label>
      <div class="input-wrap">
        <input type="password" id="pw2" placeholder="Repeat new password" autocomplete="new-password" />
        <button class="eye-btn" type="button" onclick="togglePw('pw2','eyePw2')" id="eyePw2">
          <svg id="eyePw2Icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <p class="hint">Minimum 6 characters</p>

      <button class="btn" id="submitBtn" onclick="submitReset()">Reset Password</button>
      <div class="msg" id="msg"></div>
    </div>

    <div id="expired-state">
      <p>This reset link has expired or already been used.</p>
      <a href="/" class="btn" style="display:inline-block;text-decoration:none;padding:12px 28px;width:auto">Back to Sign In</a>
    </div>

    <div id="success-state" style="display:none;text-align:center">
      <div style="font-size:48px;margin-bottom:16px">&#10003;</div>
      <h1 style="margin-bottom:8px">Password reset!</h1>
      <p class="subtitle">Your password has been updated. You can now sign in with your new password.</p>
      <a href="/" class="btn" style="display:inline-block;text-decoration:none;padding:14px;margin-top:8px">Sign In</a>
    </div>

    <a href="/" class="back-link">Back to sign in</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';

    function show(id) {
      ['loading-state','form-state','expired-state','success-state'].forEach(s => {
        document.getElementById(s).style.display = s === id ? 'block' : 'none';
      });
    }

    function togglePw(inputId) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + type;
      el.style.display = 'block';
    }

    async function verifyToken() {
      if (!token) { show('expired-state'); return; }
      try {
        const r = await fetch('/api/auth/verify-reset-token?token=' + encodeURIComponent(token));
        if (r.ok) show('form-state');
        else show('expired-state');
      } catch { show('expired-state'); }
    }

    async function submitReset() {
      const pw = document.getElementById('pw').value.trim();
      const pw2 = document.getElementById('pw2').value.trim();
      if (!pw || pw.length < 6) { showMsg('Password must be at least 6 characters.', 'error'); return; }
      if (pw !== pw2) { showMsg('Passwords do not match.', 'error'); return; }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Resetting...';

      try {
        const r = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: pw }),
        });
        const data = await r.json();
        if (r.ok) {
          show('success-state');
        } else {
          showMsg(data.error || 'Something went wrong. Please try again.', 'error');
          btn.disabled = false;
          btn.textContent = 'Reset Password';
        }
      } catch {
        showMsg('Network error. Please try again.', 'error');
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    }

    verifyToken();
  </script>
</body>
</html>
